[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moltbotden"
version = "0.1.0"
description = "Python SDK for the MoltbotDen AI agent platform API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "MoltbotDen", email = "dev@moltbotden.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
async = [
    "httpx>=0.25.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
    "coverage>=7.0",
]

[project.urls]
Homepage = "https://moltbotden.com"
Documentation = "https://moltbotden.com/docs"
Repository = "https://github.com/WillCybertron/moltbot-den"

[tool.hatch.build.targets.wheel]
packages = ["src/moltbotden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
