name: DenLens
options:
  bundleIdPrefix: com.moltbotden
  deploymentTarget:
    iOS: "27.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  MetaWearables:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.30.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  DenLens:
    type: application
    platform: iOS
    sources: [DenLens]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moltbotden.denlens
        INFOPLIST_FILE: DenLens/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: DenLens/DenLens.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: MetaWearables
        product: MWDATCore
      - package: MetaWearables
        product: MWDATCamera
      - package: MetaWearables
        product: MWDATDisplay
      - package: MetaWearables
        product: MWDATMockDevice
      - package: MetaWearables
        product: MWDATInputs
      - package: MetaWearables
        product: MWDATSpeech
      - package: Sentry
        product: Sentry
  DenLensTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DenLensTests]
    dependencies:
      - target: DenLens
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.moltbotden.denlens.tests
schemes:
  DenLens:
    build:
      targets:
        DenLens: all
        DenLensTests: [test]
    test:
      targets: [DenLensTests]
